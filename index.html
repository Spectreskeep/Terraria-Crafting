<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Terraria Crafting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="timeline.css" />
</head>
<body>

  <!-- Header / Search -->
  <header>
    <input id="q" type="text" placeholder="Search items..." />
    <button id="btnCategories">☰ Categories</button>
    <button id="btnTimeline">📅 Timeline</button>
    <button id="btnEvil">Crimson vs Corruption</button>
    <button id="btnGuide">📖 Field Guide</button>
    <button id="btnSettings">⚙️ Settings</button>
  </header>
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <div class="main-layout">
    <!-- Category Sidebar -->
    <aside class="category-sidebar">
      <div class="sidebar-header">Categories</div>
      <div class="category-list">
        
        <!-- All Items -->
        <div class="cat-item active" data-category="all" onclick="selectCategory('all')">
          <span class="cat-icon">📦</span>
          <span class="cat-name">All Items</span>
          <span class="cat-count" id="count-all">0</span>
        </div>
        
        <!-- Weapons with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="weapon" onclick="toggleSubcategories('weapon')">
            <span class="cat-icon">⚔️</span>
            <span class="cat-name">Weapons</span>
            <span class="cat-count" id="count-weapon">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-weapon" style="display: none;"></div>
        </div>
        
        <!-- Tools with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="tool" onclick="toggleSubcategories('tool')">
            <span class="cat-icon">🔨</span>
            <span class="cat-name">Tools</span>
            <span class="cat-count" id="count-tool">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-tool" style="display: none;"></div>
        </div>
        
        <!-- Armor with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="armor" onclick="toggleSubcategories('armor')">
            <span class="cat-icon">🛡️</span>
            <span class="cat-name">Armor</span>
            <span class="cat-count" id="count-armor">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-armor" style="display: none;"></div>
        </div>
        
        <!-- Accessories with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="accessory" onclick="toggleSubcategories('accessory')">
            <span class="cat-icon">💍</span>
            <span class="cat-name">Accessories</span>
            <span class="cat-count" id="count-accessory">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-accessory" style="display: none;"></div>
        </div>
        
        <!-- Potions with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="potion" onclick="toggleSubcategories('potion')">
            <span class="cat-icon">🧪</span>
            <span class="cat-name">Potions</span>
            <span class="cat-count" id="count-potion">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-potion" style="display: none;"></div>
        </div>
        
        <!-- Materials with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="material" onclick="toggleSubcategories('material')">
            <span class="cat-icon">📦</span>
            <span class="cat-name">Materials</span>
            <span class="cat-count" id="count-material">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-material" style="display: none;"></div>
        </div>
        
        <!-- Furniture with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="furniture" onclick="toggleSubcategories('furniture')">
            <span class="cat-icon">🪑</span>
            <span class="cat-name">Furniture</span>
            <span class="cat-count" id="count-furniture">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-furniture" style="display: none;"></div>
        </div>
        
        <!-- Blocks with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="block" onclick="toggleSubcategories('block')">
            <span class="cat-icon">🧱</span>
            <span class="cat-name">Blocks</span>
            <span class="cat-count" id="count-block">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-block" style="display: none;"></div>
        </div>
        
        <!-- Ammo with subcategories -->
        <div class="cat-group">
          <div class="cat-item" data-category="ammo" onclick="toggleSubcategories('ammo')">
            <span class="cat-icon">🏹</span>
            <span class="cat-name">Ammo</span>
            <span class="cat-count" id="count-ammo">0</span>
            <span class="cat-toggle">▶</span>
          </div>
          <div class="cat-subs" id="subs-ammo" style="display: none;"></div>
        </div>
        
      </div>
    </aside>

    <!-- Results Grid -->
    <div id="results" class="results-container"></div>
  </div>

  <!-- Choice Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modalTop">
        <img id="modalImg" alt="" />
        <div>
          <div id="modalTitle" class="modalTitle"></div>
          <div class="modalSub">Choose what you want to do</div>
        </div>
      </div>

      <div class="modalBtns">
        <button id="btnTree" class="primary">
          Craft this (ingredients → item)
        </button>
        <button id="btnUses">
          What can this craft into (item → outputs)
        </button>
      </div>

      <button id="btnClose" class="modalClose">✕</button>
      <div id="btnModalInfo" class="modal-info-icon" title="View item info">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="9" y1="8" x2="9" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="9" cy="5" r="0.9" fill="currentColor"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Item Info Modal -->
  <div id="infoModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modalTop">
        <img id="infoModalImg" alt="" />
        <div>
          <div id="infoModalTitle" class="modalTitle"></div>
          <div id="infoModalStation" class="modalSub"></div>
        </div>
      </div>

      <div id="infoModalContent" style="margin-top: 16px; font-size: 14px;"></div>

      <div style="margin-top: 16px;">
        <a id="infoModalWikiLink" href="#" target="_blank" rel="noopener noreferrer" 
           style="display: inline-block; padding: 10px 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
          📖 Open Wiki Page
        </a>
      </div>

      <button id="infoModalClose" class="modalClose">✕</button>
    </div>
  </div>

  <!-- Tree Overlay -->
  <div id="treeOverlay" class="tree hidden">
    <div class="treeTopbar">
      <button id="treeBack">← Back</button>
      <div id="treeTitle" class="treeTitle"></div>
      <div id="treeLegend" class="tree-legend" style="display: none;">
        <span style="display: flex; align-items: center; gap: 6px;">
          <span style="width: 20px; height: 3px; background: #dc2626;"></span>
          <span style="font-size: 13px;">Crimson</span>
        </span>
        <span style="display: flex; align-items: center; gap: 6px; margin-left: 16px;">
          <span style="width: 20px; height: 3px; background: #9333ea;"></span>
          <span style="font-size: 13px;">Corruption</span>
        </span>
      </div>
    </div>

    <div id="treeViewport" class="treeViewport">
      <div id="treeWorld" class="treeWorld"></div>
    </div>
  </div>

  <!-- Timeline Page -->
  <div id="timelinePage" class="timeline-page hidden">
    <div class="timeline-header">
      <button id="timelineBack">← Back</button>
      <h1 id="timelineTitle">Timeline</h1>
    </div>
    <div id="timelineContent" class="timeline-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
